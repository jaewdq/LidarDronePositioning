[global]
# Force this host to win BMCA against every OS1's default priority1=128,
# so it becomes grandmaster instead of just contending for the role.
priority1              0
priority2              0

# Telecom/embedded grandmaster class; lower clockClass also outranks a
# sensor's default (248 = "not synchronized to anything better").
clockClass             6
clockAccuracy          0x21
offsetScaledLogVariance 0xFFFF

# Software timestamping: ptp4l runs directly against CLOCK_REALTIME, so no
# phc2sys is needed for this host's own clock, and it works on any NIC
# (the 2026-09 field PC's enp12s0 had no PTP Hardware Clock at all).
time_stamping          software

# OS1 default sync/announce intervals; keep both ends matched so the
# sensor doesn't time out waiting on a different cadence.
logSyncInterval        0
logAnnounceInterval    1
logMinDelayReqInterval 0

# 인터페이스는 PC마다 이름이 달라서 여기 적지 않고 실행할 때 -i 로 준다:
#   sudo ptp4l -f ptp_gm.conf -i <라이다 랜카드> -m      (예: eno1, enp12s0)
