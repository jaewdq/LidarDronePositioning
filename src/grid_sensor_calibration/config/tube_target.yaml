# Target extraction for a cardboard tube standing on a grid intersection.
#
# The tube is 1.5 m tall and 0.30 m across, and BOTH numbers matter:
#
#   diameter -> target_radius (HALF of it -- 0.15, not 0.30). The LiDAR only
#               sees the half of the tube facing it, so the centroid of the
#               returns sits ~0.7 R in front of the axis: 12 cm of error,
#               pointing at the sensor from every target, which a rigid fit
#               cannot absorb. Fixing the radius turns the axis into the only
#               unknown and drops that to ~2 mm.
#
#   height   -> the z band and cluster_max_extent below.
#
# Change target_radius if the tube is a different size; nothing else here
# depends on it.

/**:
  ros__parameters:

    # 'cylinder' is what makes target_radius do anything at all -- in the
    # node's default 'centroid' mode the radius is declared and ignored, and
    # the 12 cm bias comes back silently.
    target_shape: cylinder
    target_radius: 0.15          # metres, RADIUS. 0.30 m tube -> 0.15

    # Sensor frame, [xmin, xmax, ymin, ymax, zmin, zmax].
    #
    # x/y span the whole field in every direction ON PURPOSE, because the box
    # is expressed in the SENSOR frame and nothing constrains which way a
    # sensor's own x-axis points. This installation is the example: lidar1's
    # yaw came out -89.5 deg, which puts all four targets at x = -14 .. -4.9,
    # so any box written as a positive x range finds nothing at all. Aiming it
    # would also mean knowing the sensor's heading, which is what the
    # calibration is for.
    #
    # A symmetric box removes the question. Verified against both the real
    # installation and the alternative long-axis / short-axis layouts, at every
    # multiple of 90 deg of sensor heading.
    #
    # z is the part that has to be right. With the sensor ~2 m up, the ground
    # sits at z = -2.0 and the tube spans -2.0 .. -0.5. The band starts 0.3 m
    # above the ground so the ground itself is excluded -- including it costs
    # 188 ms per scan in DBSCAN against a 100 ms budget, versus 1.3 ms for the
    # tube alone. Raise both edges by however much the sensor sits above 2 m.
    box: [-30.0, 30.0, -30.0, 30.0, -1.7, -0.6]

    # 0.30 m connects neighbouring returns out to 19 m, where the OS1's beam
    # spacing has grown to ~12 cm. The 0.20 default gets marginal there.
    cluster_tolerance: 0.30
    cluster_min_points: 6
    cluster_max_points: 100000

    # The tube's 1.5 m HEIGHT sets its extent, not its 0.3 m width. At the
    # node's 1.0 default the tube is rejected as too large.
    cluster_max_extent: 2.0

    # Quality gate on the circle fit, not a target discriminator: with only the
    # tube and the ground on the field there is nothing to discriminate. A
    # plumb tube should log ~5 mm here. Read the real number on the first
    # target and set this to about 3x it.
    #
    # It does NOT catch a leaning tube -- 5 deg of lean is 7.5 cm of centre
    # error but only 11 mm of residual. Stand it plumb.
    max_fit_residual: 0.04

    selection: largest
    voxel_size: 0.0
    log_period: 1.0

sensor1_target:
  ros__parameters:
    input_topic: /lidar1/points
    output_topic: /sensor1/target_point
    frame_id: sensor1

sensor2_target:
  ros__parameters:
    input_topic: /lidar2/points
    output_topic: /sensor2/target_point
    frame_id: sensor2
