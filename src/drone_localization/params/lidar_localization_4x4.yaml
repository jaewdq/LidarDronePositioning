lidar_drone_tracker:
  ros__parameters:
    # Indoor practice map: nominally 4 m x 4 m.
    # x/y/yaw are deliberately rough starting guesses. They put each sensor
    # just outside opposite sides of the map; replace them with the live grid
    # calibration result before relying on any world-frame coordinates.

    lidar1_topic: "/lidar1/points"
    lidar1_x:      1.534
    lidar1_y:      3.453
    lidar1_z:      0.902
    lidar1_roll:   -0.001208
    lidar1_pitch:  -0.000554
    lidar1_yaw:    1.556846

    lidar2_topic: "/lidar2/points"
    lidar2_x:      1.499
    lidar2_y:     -1.278
    lidar2_z:      0.912
    lidar2_roll:   0.007773
    lidar2_pitch: -0.003040
    lidar2_yaw:   -1.571303

    buffer_stale_timeout: 0.25
    lidar_update_rate: 10.0
    sync_tolerance_sec: 0.110

    # Historical indoor practice ROI, with margin around the usable 4 m space.
    roi_x_min: -0.5
    roi_x_max:  3.5
    roi_y_min: -0.5
    roi_y_max:  2.5
    # Floor is z=0 after the LiDAR transforms. Keep it out of clustering.
    roi_z_min:  0.25
    roi_z_max:  2.50

    voxel_leaf_size: 0.05
    sor_mean_k: 0
    sor_std_ratio: 2.0
    publish_world_clouds: false
    publish_filtered_clouds: true
    debug_timing: true
    debug_timing_period: 2.0

    # Near-range OS1 returns are dense. These are intentionally stricter than
    # the 24 x 15 m field configuration.
    cluster_tolerance: 0.15
    cluster_min_points: 3
    cluster_max_points: 200000
    cluster_max_extent: 2.00

    seed_at_home: false
    home_x: 0.0
    home_y: 0.0
    home_z: 0.0
    max_assoc_dist: 1.0
    max_assoc_dist_cap: 2.0

    proc_noise_pos: 0.05
    proc_noise_vel: 0.30
    meas_noise_pos: 0.15
    coast_max_frames: 5
    reset_after_frames: 50

    # Disable competition waypoint scoring for the indoor calibration space.
    waypoint_gate_radius: 0.5
    waypoint_speed_threshold: 0.25
    waypoint_min_frames: 4
    waypoint_grace_frames: 5
    marker1_x: 1.0
    marker1_y: 1.0
    marker2_x: 1.0
    marker2_y: 2.0
    marker3_x: 2.0
    marker3_y: 2.0
    marker4_x: 2.0
    marker4_y: 1.0
