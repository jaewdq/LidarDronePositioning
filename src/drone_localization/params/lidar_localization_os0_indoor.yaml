# 실내 그물 케이지 — 실물 Ouster OS0-SR 64ch 2대 (삼각대, 긴 변 가운데).
#
# 시뮬 저장소(DronePositioningSystem)의 lidar_localization_indoor.yaml 과 트래커
# 동작 파라미터(논문 조건, 단 복셀은 끔)·ROI·홈이 같고, 센서 외부 파라미터만 실물 기준이다.
# 필드: 원점 (0,0) = 남서 모서리 = 이륙 지점, (3,2) = 북동 모서리.
#
# 순서: calibration_gui 로 캘리브레이션 → [3. YAML 적용] 이 lidarN_* 12개 값을 바꾼다 (README.md 3장).
# 실행 (이 파일 경로를 그대로 준다):
#   ros2 run drone_localization lidar_drone_tracker --ros-args \
#       -r __node:=lidar_drone_tracker --params-file <이 파일>
#   (시뮬 저장소도 함께 빌드된 PC 에서는 실행 파일 이름이 lidar_drone_tracker_cov)

lidar_drone_tracker:
  ros__parameters:

    # --- 센서 외부 파라미터 -------------------------------------------------
    # 계획 배치: 긴 변 가운데, 그물에서 0.3 m 안쪽, 높이 약 1.2 m.
    # lidar1 은 2026-10-29 한 대 시험 값이다 (센서를 책상 위에 두고 바닥에 3 x 1.5 m
    # 기준점 4개, 원기둥 지름 10 cm). 지면 inlier 90% / sigma 5 mm, 4점 RMS 12.6 mm,
    # 보정에 안 쓴 (1.35, 1.20) 검증에서 x +0.5 cm / y -4.8 cm (y 는 거의 표면 치우침).
    # lidar2 는 아직 명목값. 케이지에 실제로 설치하면 둘 다 다시 잰다.
    lidar1_topic: "/lidar1/points"
    lidar1_x:      1.354
    lidar1_y:     -1.340
    lidar1_z:      1.264
    lidar1_roll:   -0.001339
    lidar1_pitch:  0.001849
    lidar1_yaw:    -1.555552
    lidar2_topic: "/lidar2/points"
    lidar2_x:      1.376
    lidar2_y:      3.054
    lidar2_z:      1.251
    lidar2_roll:   0.000527
    lidar2_pitch:  0.000811
    lidar2_yaw:   1.533218

    # 위 값과 extrinsic_rmse 는 캘리브레이션 결과로 바꾼다 — calibration_gui 3번 버튼
    # 또는 apply_calibration.
    # 실물 Ouster 는 원시 -x 가 필드를 보게 달므로 yaw 가 시뮬 yaml 과 부호가 반대다
    # (lidar1 약 -90°, lidar2 약 +90°). extrinsic_rmse 는 run_calibration 의 RMS.
    lidar1_extrinsic_rmse: 0.015807
    lidar2_extrinsic_rmse: 0.015198
    warn_nominal_extrinsics: true

    world_frame: "map"

    # --- 타이밍 -------------------------------------------------------------
    lidar_update_rate: 10.0
    buffer_stale_timeout: 0.25
    queue_depth: 8
    sync_tolerance_sec: 0.010
    sync_stats_window: 200

    # --- 융합 ---------------------------------------------------------------
    # 실기 운용 기본은 MF(관측 융합). 위상 고정으로 두 스캔이 같은 시각이라 MF 와 SU 가
    # 같은 결과를 내고, MF 는 스캔 쌍마다 한 번 갱신이라 더 단순하다 (모캡 비교, 2026-11).
    #   cloud = PF(점군 융합), position = MF(관측 융합), sequential = SU(순차 갱신)
    fusion_mode: "position"
    # 짝 스캔이 도착하는 즉시 처리 (PF/MF용, false면 다음 10 Hz 타이머까지 최대 0.1 s 기다린다).
    process_on_arrival: true
    sensor_agreement_dist: 0.35

    # --- ROI ----------------------------------------------------------------
    # XY: 4 x 3 m 시험 필드 = 3 x 2 m 바닥 + 사방 0.5 m. 그물·기둥(x=-1, 4)은 밖으로 잘린다.
    #     처음엔 x 0.3 / y 0.2 m 였다 (센서를 y=-0.7, 2.7 에 둘 계획이라 다리 끝이 y=-0.3, 2.3).
    #     실제 설치는 y=-1.34, 3.05 로 더 바깥이다. 2026-11-03 녹화 3개(Tello circle
    #     run01/02, Crazyflie cfo run01)의 모든 프레임에서 필드 + 0.5 m 띠에 들어온 점은 기체뿐이었고
    #     (예전 ROI 가 기체 가장자리 점을 잘라내고 있었다) 고정 물체·사람은 0 이었다.
    #     2026-11-04 에 x 를 0.9 m 까지 넓혔다가, 평가 15회가 모두 4 x 3 m 안이라 되돌렸다.
    #     센서를 안쪽으로 옮기거나 조종자가 필드 가까이 서면 다시 확인할 것.
    # Z: 이착륙까지 보려고 바닥 바로 위(0.10 m)부터. 바닥 점은 σ=8 mm 잡음이라
    #    0.10 m면 12σ 위다. 실측 바닥은 평평하지 않을 수 있으니 캘리브의 지면
    #    평면 잔차를 보고 올릴 것.
    #    상한 2.5 m: 실험실 천장이 2.61~2.70 m 라 3.3 m 로 두면 ROI 점의 98% 가 천장이었다
    #    (2026-11-03). 천장보다 0.1 m 아래로 잘라 천장 점을 빼고, 주 비행 1.0 m / 최고 2 m 에 여유를 둔다.
    roi_x_min: -0.5
    roi_x_max:  3.5
    roi_y_min: -0.5
    roi_y_max:  2.5
    roi_z_min:  0.10
    roi_z_max:  2.5
    remove_boundary_surfaces: false
    boundary_surface_margin: 0.10

    # --- 배경 제거 ----------------------------------------------------------
    # 시뮬에는 정적 잡음이 없다. 실측 케이지에서는 그물 처짐·바닥 물체가 ROI에
    # 들어올 수 있으니 그때 배경 학습을 켠다.
    use_background: false
    learn_background: false
    background_frames: 200
    background_voxel_size: 0.05
    background_distance: 0.08
    background_min_observation_ratio: 0.70

    # --- 전처리 -------------------------------------------------------------
    # 복셀 끔 (0.0). 24 x 15 m 실외 필드에서는 0.05 m 를 썼지만, 이 4 x 3 m 실내 필드에서는
    # 기체 점이 적어 끄는 편이 오차·검출 모두 나았다 (녹화 재생 비교, 2026-11).
    # 끄면 DBSCAN 비용이 늘지만 10 Hz 주기 안이다. 넓은 ROI 를 다시 쓰거나 사람이 들어오면
    # 비용이 커지므로 그때는 재측정할 것.
    voxel_leaf_size: 0.0
    sor_mean_k:    0
    sor_std_ratio:  2.0

    # --- 클러스터링 ---------------------------------------------------------
    # 논문 조건 (0.40 m / 3점 / 400점 / 1.2 m). 복셀을 꺼도 최대 400 은 유지한다:
    # 실기 시범 5회에서 400 과 1500 의 결과가 같았다 (2026-11-05).
    cluster_tolerance:  0.40
    cluster_min_points: 3
    cluster_max_points: 400
    cluster_max_extent: 1.20
    cluster_min_extent: 0.02

    # --- 측정 공분산 --------------------------------------------------------
    meas_noise_pos: 0.10
    centroid_noise_floor: 0.025
    range_noise_per_meter: 0.002
    min_detection_std: 0.03
    max_detection_std: 0.50

    # --- 칼만필터 -----------------------------------------------------------
    process_noise_q: 0.4
    seed_at_home: true
    home_x: 0.0                 # 이륙 지점 = 원점 (필드 남서 모서리)
    home_y: 0.0
    home_z: 0.15                # 패드 위에 앉은 기체 중심 높이 (호버 고도가 아님)
    home_seed_std: 0.50

    # --- 연관 게이트 / 코스팅 -----------------------------------------------
    max_assoc_dist: 2.0
    gate_sigma_k: 3.0
    max_assoc_dist_cap: 4.0
    coast_max_frames: 15
    reset_after_frames: 50

    # --- 경로점 검출 --------------------------------------------------------
    # 이 맵에는 마커가 없다.
    enable_waypoint_tracking: false

    # --- 디버그 발행 --------------------------------------------------------
    publish_world_clouds: false
    publish_filtered_clouds: true
    debug_timing: false
    debug_timing_period: 2.0
